[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-game-state-intelligence"
version = "0.1.0"
description = "Transparent soccer event analysis by tactical game state"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "requests>=2.32,<3",
  "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["src"]
